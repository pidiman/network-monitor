# Network Monitor Agent — Docker Compose / Synology Container Manager example
#
# One-shot job: the container runs ONE measurement
# (GET config -> Ookla speedtest -> POST result) and exits.
# Start it again to run another measurement. Scheduling comes later.
#
# Provide the values via a .env file next to this compose file
# (see docker/.env.example — never commit the real .env), or replace the
# ${...} placeholders directly in the Container Manager YAML editor.
# Never commit a real API key.

services:
  network-monitor:
    image: ghcr.io/pidiman/network-monitor:latest
    container_name: network-monitor

    # Measure the host's own internet connectivity as directly as possible.
    # No ports are published; the container only makes outbound requests.
    network_mode: host

    environment:
      NETWORK_MONITOR_API_KEY: "${NETWORK_MONITOR_API_KEY}"
      # Public default. LAN variant without hairpin NAT, e.g.:
      #   http://192.168.1.27:3077/api/network
      NETWORK_MONITOR_API_BASE_URL: "${NETWORK_MONITOR_API_BASE_URL:-https://notes.pidiman.sk/api/network}"

    restart: "no"
