name: Docker image

# Builds the multi-arch image and publishes it to GHCR:
#   push to main  -> ghcr.io/pidiman/network-monitor:latest (+ sha-<short>)
#   tag v1.2.3    -> ghcr.io/pidiman/network-monitor:1.2.3, :1.2, :v1.2.3
#   pull request  -> build only, nothing is pushed
# No API key or other secret is used; GHCR login uses the built-in GITHUB_TOKEN.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/pidiman/network-monitor
  PLATFORMS: linux/amd64,linux/arm64,linux/arm/v7

jobs:
  test:
    name: Lint & tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: bash -n
        run: |
          for f in install.sh uninstall.sh src/network-speedtest.sh tests/*.sh; do
            bash -n "$f"
          done

      - name: shellcheck
        run: shellcheck -x install.sh uninstall.sh src/network-speedtest.sh tests/*.sh

      - name: Agent tests (offline, mocks)
        run: ./tests/test-agent.sh

      - name: Docker image tests (local arch, mock API)
        run: ./tests/test-docker.sh

  docker:
    name: Build & publish
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=tag
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: ${{ env.PLATFORMS }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # plain multi-arch manifest (no "unknown/unknown" attestation entries)
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify published image
        if: github.event_name != 'pull_request'
        run: |
          docker buildx imagetools inspect "${IMAGE_NAME}:sha-${GITHUB_SHA::7}"
